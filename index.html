<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOS S3X-MEN | Dossier de Superhéroes (Turno Noche LATAM)</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #121824;
            --yellow-accent: #ffde00;
            --red-accent: #ff2a2a;
            --blue-accent: #00d2ff;
            --border-color: #000000;
            --text-color: #f0f4f8;
            --card-bg: #1a202c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            background-image: radial-gradient(rgba(255, 222, 0, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#ffffff 15%, transparent 16%);
            background-size: 12px 12px;
            opacity: 0.03;
            pointer-events: none;
            z-index: 999;
        }

        header {
            background: var(--panel-bg);
            border-bottom: 5px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 6px 0 var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge-comic {
            background: var(--yellow-accent);
            color: #000;
            font-family: 'Bangers', cursive;
            font-size: 1.8rem;
            padding: 5px 15px;
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0 var(--border-color);
            transform: rotate(-2deg);
        }

        .title-group h1 {
            font-family: 'Bangers', cursive;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: var(--yellow-accent);
            text-shadow: 3px 3px 0 var(--border-color);
        }

        .title-group p {
            font-size: 0.85rem;
            font-weight: 700;
            color: #a0aec0;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: #1a202c;
            color: #fff;
            border: 3px solid var(--border-color);
            padding: 6px 10px;
            font-family: 'Bangers', cursive;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--border-color);
            transition: all 0.1s ease;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: var(--yellow-accent);
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--border-color);
        }

        .nav-btn.active {
            background: var(--red-accent);
            color: #fff;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--border-color);
        }

        main {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .chapter-panel {
            display: none;
            background: var(--panel-bg);
            border: 5px solid var(--border-color);
            box-shadow: 10px 10px 0 var(--border-color);
            padding: 35px;
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
        }

        .chapter-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chapter-tag {
            position: absolute;
            top: -20px;
            left: 30px;
            background: var(--red-accent);
            color: #fff;
            font-family: 'Bangers', cursive;
            font-size: 1.4rem;
            padding: 4px 20px;
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0 var(--border-color);
            transform: rotate(1deg);
        }

        h2.comic-title {
            font-family: 'Bangers', cursive;
            font-size: 2.8rem;
            color: var(--yellow-accent);
            text-shadow: 3px 3px 0 var(--border-color);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .cover-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
        }

        @media (max-width: 900px) {
            .cover-grid { grid-template-columns: 1fr; }
        }

        .cover-text p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border: 3px solid var(--border-color);
        }

        .banner-img-wrapper {
            border: 4px solid var(--border-color);
            box-shadow: 6px 6px 0 var(--border-color);
            overflow: hidden;
            background: #000;
        }

        .banner-img-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .feature-boxes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .f-box {
            background: #1a202c;
            border: 3px solid var(--border-color);
            padding: 15px;
            box-shadow: 4px 4px 0 var(--border-color);
        }

        .f-box h4 {
            font-family: 'Bangers', cursive;
            font-size: 1.4rem;
            color: var(--blue-accent);
            margin-bottom: 5px;
        }

        /* ROSTER DE HÉROES Y TARJETAS COMERCIALES */
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .hero-card {
            background: #1a202c;
            border: 4px solid var(--border-color);
            box-shadow: 8px 8px 0 var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .hero-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 11px 11px 0 var(--border-color);
            border-color: var(--yellow-accent);
        }

        .hero-card-img-wrapper {
            width: 100%;
            background: #000;
            border-bottom: 4px solid var(--border-color);
            overflow: hidden;
            height: 280px;
        }

        .hero-card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-card-info {
            padding: 20px;
            background: #121824;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }

        .hero-card-info h3 {
            font-family: 'Bangers', cursive;
            font-size: 1.8rem;
            color: var(--yellow-accent);
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 var(--border-color);
        }

        .hero-click-hint {
            background: var(--blue-accent);
            color: #000;
            font-family: 'Bangers', cursive;
            font-size: 1.1rem;
            padding: 8px;
            border: 3px solid var(--border-color);
            box-shadow: 3px 3px 0 var(--border-color);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* TARJETAS DE KPI EN DATABASE */
        .kpi-card {
            background-color: var(--card-bg);
            border: 4px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            box-shadow: 6px 6px 0 var(--border-color);
            text-align: center;
            transition: transform 0.15s ease;
        }

        .kpi-card:hover {
            transform: translateY(-3px);
            border-color: var(--yellow-accent);
        }

        /* MODAL / EXPEDIENTE B2B (PÁGINAS A, B, C) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #121824;
            border: 5px solid var(--border-color);
            box-shadow: 12px 12px 0 var(--border-color);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .modal-header {
            background: var(--yellow-accent);
            color: #000;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-color);
        }

        .modal-header h2 {
            font-family: 'Bangers', cursive;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        .close-modal-btn {
            background: var(--red-accent);
            color: #fff;
            border: 3px solid var(--border-color);
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 3px 3px 0 var(--border-color);
        }

        .modal-body {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 15px;
            flex-wrap: wrap;
        }

        .modal-tab-btn {
            background: #1a202c;
            color: #8892b0;
            border: 3px solid var(--border-color);
            padding: 10px 20px;
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--border-color);
        }

        .modal-tab-btn:hover {
            color: var(--yellow-accent);
        }

        .modal-tab-btn.active {
            background: var(--red-accent);
            color: #fff;
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--border-color);
        }

        .modal-tab-pane {
            display: none;
            background: #1a202c;
            border: 3px solid var(--border-color);
            padding: 25px;
            box-shadow: 5px 5px 0 var(--border-color);
            flex-direction: column;
            gap: 15px;
        }

        .modal-tab-pane.active {
            display: flex;
        }

        .modal-tab-pane h3 {
            font-family: 'Bangers', cursive;
            font-size: 1.8rem;
            color: var(--yellow-accent);
            border-bottom: 2px dashed rgba(255,255,255,0.2);
            padding-bottom: 8px;
        }

        .modal-tab-pane p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .twitch-link-btn {
            display: inline-block;
            background: var(--yellow-accent);
            color: #000;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            padding: 12px 25px;
            text-align: center;
            border: 3px solid var(--border-color);
            box-shadow: 5px 5px 0 var(--border-color);
            text-decoration: none;
            margin-top: 10px;
        }

        .twitch-link-btn:hover {
            background: var(--red-accent);
            color: #fff;
        }

        .comic-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border: 4px solid var(--border-color);
            box-shadow: 6px 6px 0 var(--border-color);
            background: #1a202c;
        }

        .comic-table th, .comic-table td {
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            text-align: left;
            font-size: 0.95rem;
        }

        .comic-table th {
            background: var(--yellow-accent);
            color: #000;
            font-family: 'Bangers', cursive;
            font-size: 1.3rem;
        }

        .comic-grid-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .comic-item-card {
            background: #1a202c;
            border: 3px solid var(--border-color);
            padding: 20px;
            box-shadow: 5px 5px 0 var(--border-color);
        }

        .comic-item-card h3 {
            font-family: 'Bangers', cursive;
            font-size: 1.6rem;
            color: var(--yellow-accent);
            margin-bottom: 10px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 5px;
        }

        .comic-item-card p, .comic-item-card li {
            font-size: 0.9rem;
            color: #cbd5e0;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .comic-item-card ul {
            padding-left: 18px;
            margin-top: 5px;
        }

        .btn-link {
            display: inline-block;
            background: var(--blue-accent);
            color: #000;
            padding: 6px 12px;
            font-weight: 700;
            font-size: 0.85rem;
            border: 2px solid var(--border-color);
            box-shadow: 3px 3px 0 var(--border-color);
            text-decoration: none;
            margin-top: 10px;
        }

        .btn-link:hover {
            background: var(--yellow-accent);
        }

        .comic-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            background: #1a202c;
            border: 4px solid var(--border-color);
            padding: 30px;
            box-shadow: 6px 6px 0 var(--border-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            color: var(--yellow-accent);
        }

        .form-group input, .form-group select, .form-group textarea {
            background: #0b0f19;
            border: 3px solid var(--border-color);
            color: #fff;
            padding: 10px;
            font-family: 'Montserrat', sans-
