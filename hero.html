<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expediente | Instituto S3X-MEN</title><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>
:root{--gold:#e8bd55;--purple:#9c5bff;--cyan:#00d2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#20233a,#090c15 65%);color:#edf1fa;font-family:Inter,Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top a,.twitch{color:#07101b;background:var(--cyan);padding:12px 18px;text-decoration:none;font-weight:800;border:3px solid #05070c;box-shadow:4px 4px #000}.comic{font-family:Bangers,cursive;color:#ffdf00;letter-spacing:1px}.hero{display:grid;grid-template-columns:minmax(260px,390px) 1fr;gap:26px;margin-top:24px}.portrait{background:#111827;border:8px double var(--gold);padding:10px;min-height:440px;display:flex;align-items:center;justify-content:center}.portrait img{width:100%;height:100%;max-height:650px;object-fit:contain;object-position:center}.panel{background:#101522;border:3px solid #03050a;box-shadow:8px 8px #000;padding:22px;margin-bottom:16px}.panel h2,.panel h3{margin-top:0}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tabs button{background:#22283a;color:white;border:2px solid var(--gold);padding:10px;cursor:pointer;font-weight:800}.tabs button.active{background:var(--gold);color:#111}.tab{display:none}.tab.active{display:block}.muted{color:#9eabc1}.twitch{display:inline-block;background:#b68cff;margin-top:12px}@media(max-width:760px){.hero{grid-template-columns:1fr}.portrait{min-height:300px}.wrap{padding:14px}}
</style></head><body><div class="wrap"><div class="top"><h1 class="comic">INSTITUTO S3X-MEN / EXPEDIENTE INDIVIDUAL</h1><a href="index.html">← VOLVER AL ROSTER</a></div><div id="profile"><p class="muted">Cargando expediente…</p></div></div><script>
const members=[
{id:"losmoriartys",name:"MORIARTYS",role:"Dirección",country:"Argentina",img:"moriartys.jpg",link:"https://twitch.tv/losmoriartys",bio:"Demi y Ari: pareja gamer, cultura retro, simuladores, terror cooperativo y entretenimiento.",powers:"Entretenimiento en pareja · Cooperativos · Simuladores · Cultura geek.",log:"Fundadores del Instituto. Creator Partner de Enshrouded y Cinderia."},
{id:"ther0d3r1k",name:"ROD3R1K",role:"Dirección",country:"Bolivia",img:"rod3r1k.jpg",link:"https://twitch.tv/ther0d3r1k",bio:"Creador Partner de Twitch. Gaming, música y entretenimiento.",powers:"Fortnite · Valorant · Minecraft · Música y comunidad.",log:"Partner de Twitch."},
{id:"ladymoriarty01",name:"LADYMORIARTY",role:"Cuerpo docente",country:"Argentina",img:"ladymoriarty.jpg",link:"https://twitch.tv/ladymoriarty01",bio:"Gameplay chill, IRL y entretenimiento.",powers:"Variedad · Comunidad · IRL.",log:"Integrante del cuerpo docente."},
{id:"capyunaplay",name:"CAPY",role:"Cuerpo docente",country:"Argentina",img:"capy.jpg",link:"https://twitch.tv/capyunaplay",bio:"Terror, Dead by Daylight y cooperativos.",powers:"Horror · DBD · Phasmophobia · Lethal Company.",log:"Integrante del cuerpo docente."},
{id:"ardipii",name:"ARDIPII",role:"Cuerpo docente",country:"México",img:"ardipii.jpg",link:"https://twitch.tv/ardipii",bio:"Variedad, Just Chatting, Valorant, Minecraft y simuladores.",powers:"Comunidad · Shooters · Simuladores.",log:"Integrante del cuerpo docente."},
{id:"akumazoldyck",name:"AKUMA",role:"Cuerpo docente",country:"México",img:"akuma.jpg",link:"https://twitch.tv/akumazoldyck",bio:"Talk show, amigos y videojuegos.",powers:"Horror cooperativo · Lethal Company · R.E.P.O.",log:"Integrante del cuerpo docente."},
{id:"elgabii090",name:"ELGABII090",role:"Cuerpo docente",country:"Argentina",img:"elgabii.jpg",link:"https://twitch.tv/elgabii090",bio:"Rocket League, simuladores y juegos cooperativos.",powers:"Rocket League · Simuladores · Terror coop.",log:"Integrante del cuerpo docente."},
{id:"habitos_atomicos",name:"HÁBITOS ATÓMICOS",role:"Cuerpo docente",country:"Argentina",img:"habitos.jpg",link:"https://twitch.tv/habitos_atomicos",bio:"Charlas sobre hábitos, productividad y crecimiento personal, además de gaming.",powers:"Just Chatting · Minecraft · Hábitos y productividad.",log:"Integrante del cuerpo docente."},
{id:"daved0608",name:"DAVE",role:"Estudiante",country:"Por confirmar",img:"dave.jpg",link:"https://twitch.tv/daved0608",bio:"Nuevo talento del Instituto.",powers:"Perfil pendiente de completar con el creador.",log:"Ingreso al roster como estudiante."},
{id:"patoteexplica",name:"PATO TE EXPLICA",role:"Estudiante",country:"Por confirmar",img:"pato.jpg",link:"https://www.youtube.com/@patoteexplica",bio:"Creador de YouTube incorporado al roster.",powers:"Perfil editorial y especialidades por confirmar.",log:"Nuevo ingreso al Instituto como estudiante."}
];
const id=new URLSearchParams(location.search).get("id");const m=members.find(x=>x.id===id);const root=document.getElementById("profile");
if(!m){root.innerHTML='<div class="panel">No se encontró el expediente. <a href="index.html">Volver al roster</a></div>'}
else{root.innerHTML='<div class="hero"><div class="portrait"><img src="'+m.img+'" alt="Retrato de '+m.name+'" onerror="this.style.display=\'none\'"></div><div><div class="panel"><p class="muted">EXPEDIENTE · '+m.role.toUpperCase()+' · '+m.country.toUpperCase()+'</p><h2 class="comic">'+m.name+'</h2><a class="twitch" href="'+m.link+'" target="_blank" rel="noopener">VISITAR CANAL OFICIAL ↗</a><div class="tabs"><button class="active" data-tab="0">#01 BIOGRAFÍA</button><button data-tab="1">#02 HABILIDADES</button><button data-tab="2">#03 ESTADÍSTICAS</button><button data-tab="3">#04 MISIONES</button></div><div class="panel tab active"><h3>#01 · EXPEDIENTE PERSONAL</h3>'+m.bio+'</div><div class="panel tab"><h3>#02 · HABILIDADES Y PODERES</h3>'+m.powers+'</div><div class="panel tab"><h3>#03 · ESTADÍSTICAS Y JUEGOS</h3><div id="live-status" class="muted">Consultando estado del canal…</div><div id="verified-stats" class="muted">Cargando estadísticas verificadas…</div><div id="game-breakdown"></div><div id="vod-list"></div></div><div class="panel tab"><h3>#04 · MISIONES Y LOGROS</h3>'+m.log+'</div></div></div></div>';
root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{root.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));root.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");root.querySelectorAll(".tab")[Number(b.dataset.tab)].classList.add("active")})}

async function loadChannelStats(){
 if(m.id==="patoteexplica"){document.getElementById("live-status").textContent="Canal de YouTube: no utiliza el estado en vivo de Twitch.";document.getElementById("verified-stats").textContent="Las métricas de YouTube requieren integración independiente.";return;}
 try{
  const response=await fetch("data.json?ts="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error("Archivo de estadísticas aún no publicado.");
  const data=await response.json();const c=(data.channels||[]).find(x=>x.login&&x.login.toLowerCase()===m.id.toLowerCase());
  if(!c||c.status!=="ok")throw new Error(c?.error||"Canal todavía sin datos sincronizados.");
  const live=c.live||{};document.getElementById("live-status").innerHTML=live.is_live?"<strong style='color:#4dff9b'>● EN DIRECTO</strong> · "+(live.game_name||"Categoría no informada")+"<br>"+(live.title||"Sin título"):"<strong>○ OFFLINE</strong> · Última consulta: "+new Date(data.updated_at).toLocaleString("es-AR");
  const st=c.stats||{};document.getElementById("verified-stats").innerHTML="<h4>ÚLTIMOS "+data.period_days+" DÍAS</h4><p>Directos archivados: "+(st.streams??"N/D")+" · Horas emitidas: "+(st.hours_streamed??"N/D")+" · Vistas de VOD: "+(st.video_views??"N/D")+"</p><p>Seguidores: N/D · Promedio/pico: N/D · Horas vistas: N/D</p><small>Actualizado: "+new Date(data.updated_at).toLocaleString("es-AR")+"</small>";
  document.getElementById("game-breakdown").innerHTML="<h4>JUEGOS POR HORAS EMITIDAS</h4>"+((c.games||[]).map(g=>"<p>"+g.game+" — "+g.hours_streamed+" h · "+g.streams+" VODs</p>").join("")||"Sin VODs en el período.");
  document.getElementById("vod-list").innerHTML="<h4>ÚLTIMOS VODs</h4>"+((c.vods||[]).slice(0,10).map(v=>"<p><a target='_blank' rel='noopener' href='"+v.url+"'>"+v.title+"</a> · "+v.game_name+" · "+v.duration+"</p>").join("")||"No hay VODs registrados en el período.");
 }catch(e){document.getElementById("live-status").textContent="Estado no disponible";document.getElementById("verified-stats").textContent=e.message+" La primera ejecución de GitHub Actions debe completar la sincronización.";}
}
loadChannelStats();
</script></body></html>
