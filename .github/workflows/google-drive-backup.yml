name: Google Drive backup (manual; schedule disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Run backup engine failure-injection tests
        run: python -m unittest discover -s tests -p 'test_google_drive_backup_failures.py' -v
      - name: Syntax-check backup and restore scripts
        run: python -m py_compile scripts/google_drive_backup.py scripts/google_drive_restore.py scripts/google_drive_oauth_setup.py
      - name: Create, upload, download and verify backup
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/google_drive_backup.py
