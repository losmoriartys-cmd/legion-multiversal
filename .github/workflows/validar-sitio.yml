name: Validar código y datos del sitio

on:
  push:
    paths:
      - 'app.js'
      - 'playwright.config.js'
      - 'index.html'
      - 'bitacora-preview.html'
      - 'styles.css'
      - '*.css'
      - '*.json'
      - 'assets/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - 'update_clips.py'
      - '.github/workflows/validar-sitio.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'bitacora-preview.html'
      - 'styles.css'
      - '*.css'
      - '*.json'
      - 'assets/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - 'update_clips.py'
      - '.github/workflows/validar-sitio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis JavaScript
        run: node --check app.js
      - name: Validar archivos JSON
        run: |
          for file in ./*.json schemas/*.json; do
            [ -f "$file" ] || continue
            echo "Validando $file"
            python -m json.tool "$file" > /dev/null
          done
      - name: Validar modelo del roster y cobertura Twitch
        run: python scripts/validate_roster_data.py --check-activity --check-platforms
      - name: Comprobar índice accesible sin JavaScript
        run: python scripts/render_roster_noscript.py --check
      - name: Instalar Pillow para medir imágenes
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Auditar dimensiones intrínsecas de imágenes HTML
        run: python scripts/add_image_dimensions.py --check --measure-remotes index.html
      - name: Auditar referencias de imágenes en main y snapshots históricos
        run: |
          mkdir -p reports/image-audit
          git worktree add --detach /tmp/image-audit-b8fd4ae b8fd4ae
          git worktree add --detach /tmp/image-audit-0d578a0 0d578a02cfe9ab775ad4623096a93d2d33641fd8
          python scripts/audit_image_references.py --root /tmp/image-audit-b8fd4ae --output reports/image-audit/b8fd4ae.md
          python scripts/audit_image_references.py --root /tmp/image-audit-0d578a0 --output reports/image-audit/0d578a0.md
          python scripts/audit_image_references.py --root . --output reports/image-audit/main.md
      - name: Compilar colectores Python
        run: python -m py_compile scripts/audit_image_references.py update_stats.py update_platform_stats.py update_clips.py scripts/validate_roster_data.py scripts/validate_clips_data.py scripts/render_roster_noscript.py scripts/validate_metric_history.py scripts/build_creator_metrics.py scripts/validate_creator_metrics.py scripts/audit_and_optimize_images.py scripts/add_image_dimensions.py scripts/summarize_lighthouse.py scripts/lh_failures.py
      - name: Ejecutar pruebas unitarias Python del repositorio
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Probar lectura de cuentas por los colectores
        run: |
          python -c "import update_stats; channels=update_stats.load_active_channels(); assert len(channels)==7 and 'losmoriartys' in channels; print('OK: colector Twitch lee {} canales'.format(len(channels)))"
          python -c "import update_platform_stats; creators=update_platform_stats.load_creator_accounts(); assert 'pato-oratoris' in creators and 'youtube' in [a['platform'] for a in creators['pato-oratoris']['accounts']]; print('OK: colector multiplataforma lee {} perfiles'.format(len(creators)))"
      - name: Validar registro de clips públicos
        run: python scripts/validate_clips_data.py
      - name: Validar historial y semántica de métricas Twitch
        run: python scripts/validate_metric_history.py
      - name: Generar registro normalizado de métricas por creador
        run: python scripts/build_creator_metrics.py
      - name: Validar modelo normalizado multiplataforma
        run: python scripts/validate_creator_metrics.py
      - name: Instalar dependencias de pruebas de navegador
        run: npm install
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Probar expedientes, Bitácora, modales y hashes históricos
        run: npm run test:e2e
      - name: Comprobar el registro de canales para el colector de clips
        run: |
          python -c "import update_clips; accounts=update_clips.load_roster_accounts(); assert len(accounts)==7 and any(a['creator_id']=='moriartys' for a in accounts); print('OK: colector de clips lee {} canales Twitch'.format(len(accounts)))"
      - name: Validar rutas, imágenes y enlaces declarados
        run: python scripts/validate_site.py
      - name: Publicar auditorías de referencias de imágenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-reference-audit-${{ github.sha }}
          path: reports/image-audit/
          if-no-files-found: warn
          retention-days: 30
