name: Validar código y datos del sitio

on:
  push:
    branches:
      - main
    paths:
      - 'app.js'
      - 'games-registry.js'
      - 'arsenal-registry.js'
      - 'chapters-refresh.js'
      - 'playwright.config.js'
      - 'index.html'
      - 'bitacora-preview.html'
      - 'styles.css'
      - '*.css'
      - '*.json'
      - 'assets/**'
      - '*.webp'
      - 'scripts/**'
      - 'schemas/**'
      - 'data/**'
      - 'tests/**'
      - 'requirements-data-contracts.txt'
      - 'update_clips.py'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'data/**'
      - 'app.js'
      - 'games-registry.js'
      - 'chapters-refresh.js'
      - 'index.html'
      - 'bitacora-preview.html'
      - 'styles.css'
      - '*.css'
      - '*.json'
      - 'assets/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - 'update_clips.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolver preview vigente de main para baseline visual
        id: main-preview
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          MAIN_SHA="$(git rev-parse origin/main)"
          python scripts/resolve_main_preview.py --repo "$GITHUB_REPOSITORY" --sha "$MAIN_SHA"
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check app.js
          node --check games-registry.js
          node --check arsenal-registry.js
          node --check chapters-refresh.js
      - name: Instalar motor de contratos JSON Schema
        run: python -m pip install --disable-pip-version-check -r requirements-data-contracts.txt
      - name: Validar archivos JSON
        run: |
          for file in ./*.json data/*.json schemas/*.json; do
            [ -f "$file" ] || continue
            echo "Validando $file"
            python -m json.tool "$file" > /dev/null
          done
      - name: Validar modelo del roster y cobertura Twitch
        run: python scripts/validate_roster_data.py --check-activity --check-platforms
      - name: Validar registro maestro de juegos
        run: python scripts/validate_games_registry.py
      - name: Comprobar índice accesible sin JavaScript
        run: python scripts/render_roster_noscript.py --check
      - name: Instalar Pillow para medir imágenes
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Auditar dimensiones intrínsecas de imágenes HTML
        run: python scripts/add_image_dimensions.py --check --measure-remotes index.html
      - name: Verificar candidatos responsive del Hero y preload adaptable
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          widths = (480, 640, 960, 1280)
          for width in widths:
              path = Path(f"image_20261106_124855-{width}.webp")
              assert path.is_file(), f"Falta el candidato responsive {path.name}."
              with Image.open(path) as image:
                  image.load()
                  assert image.format == "WEBP", f"{path.name} no es WebP."
                  assert image.width == width, f"{path.name} no tiene el ancho esperado."
          assert 'src="image_20261106_124855-960.webp"' in html, "El Hero no usa el candidato responsive como fallback."
          assert 'width="960" height="505"' in html, "Las dimensiones intrínsecas no coinciden con el fallback del Hero."
          assert all(f"image_20261106_124855-{width}.webp {width}w" in html for width in widths), "Falta un candidato en srcset."
          assert 'imagesrcset=' in html and 'imagesizes=' in html, "El preload no negocia imágenes responsive."
          assert 'calc(100vw - 64px)' in html, "El sizes móvil no refleja el ancho útil del Hero."
          assert 'fetchpriority="high"' in html, "El Hero perdió fetchpriority high."
          assert '<style id="critical-home-styles">' in html, "Falta CSS crítico inline para la primera pantalla."
          assert '<style id="conversion-overhaul-inline">' in html and '<style id="conversion-phase2-inline">' in html, "Faltan los estilos de conversión inline."
          assert 'href="./conversion-overhaul.css' not in html and 'href="./conversion-phase2.css' not in html, "Quedaron hojas de conversión bloqueantes externas."
          preload_head = html.split('<link href="https://fonts.googleapis.com/css2?', 1)[0]
          assert 'bangers/v25/' in preload_head and 'robotocondensed/v31/' in preload_head, "Faltan fuentes de primera pantalla."
          assert 'specialelite/v20/' not in preload_head, "Special Elite no debe competir con las fuentes críticas."
          assert '<link rel="stylesheet" id="lm-global-chapter-styles" data-href="./styles.css?v=20261121-arsenal-registry-1">' in html, "La hoja global de capítulos no está diferida bajo demanda."
          assert '<noscript><link rel="stylesheet" href="./styles.css?v=20261121-arsenal-registry-1"></noscript>' in html, "Falta fallback de CSS global sin JavaScript."
          critical = html.split('<style id="critical-home-styles">', 1)[1].split('</style>', 1)[0]
          for selector in ("header{", ".header-top{", "main{", ".chapter-panel{", ".executive-hero{", ".executive-hero-art img{", "#chapter-0 .executive-hero-art.executive-hero-banner{", "#chapter-0 .executive-hero-art.executive-hero-banner img{", ".executive-button{", "#chapter-0.chapter-panel.active{", "#chapter-0.chapter-panel.active .chapter-tag{"):
              assert selector in critical, f"Falta estilo crítico: {selector}"
          print("OK: Hero responsive, preload adaptable, CSS crítico inline y fallback noscript verificados.")
          PY
      - name: Verificar contrato del emblema WebP lossless
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("legion_logo_final_hybrid.png")
          output = Path("legion_logo_final_hybrid.webp")
          responsive = Path("legion_logo_final_hybrid-512.webp")
          compact = Path("legion_logo_final_hybrid-256.webp")
          assert source.is_file() and output.is_file() and responsive.is_file() and compact.is_file(), "Falta un asset del emblema."
          with Image.open(source) as original, Image.open(output) as optimized, Image.open(responsive) as medium, Image.open(compact) as small:
              assert optimized.format == medium.format == small.format == "WEBP", "Los emblemas optimizados no son WebP."
              assert optimized.size == original.size == (1600, 1600), "Cambió la dimensión del maestro."
              assert medium.size == (512, 512), "El derivado medio no mide 512x512."
              assert small.size == (256, 256), "El derivado compacto no mide 256x256."
              assert all("A" in image.getbands() for image in (optimized, medium, small)), "Se perdió transparencia."
              for image in (optimized, medium, small):
                  image.load()
          assert output.stat().st_size < source.stat().st_size, "El maestro WebP no reduce el peso."
          assert responsive.stat().st_size < output.stat().st_size, "El derivado de 512px no reduce el peso."
          assert compact.stat().st_size < responsive.stat().st_size, "El derivado de 256px no reduce el peso."
          for page in (Path("index.html"), Path("comic-moriartys.html")):
              content = page.read_text(encoding="utf-8")
              assert "legion_logo_final_hybrid.webp" in content, f"Falta el maestro WebP en {page}."
              assert "legion_logo_final_hybrid-512.webp" in content, f"Falta el derivado de 512px en {page}."
              assert "legion_logo_final_hybrid-256.webp" in content, f"Falta el derivado de 256px en {page}."
              assert "srcset=" in content and "sizes=" in content, f"Falta srcset/sizes en {page}."
              assert 'width="256" height="256"' in content, f"Las dimensiones intrínsecas no coinciden en {page}."
              assert 'src="legion_logo_final_hybrid-256.webp"' in content, f"La imagen base no usa el emblema compacto en {page}."
              assert 'legion_logo_final_hybrid-256.webp 256w' in content, f"Falta el candidato compacto en srcset de {page}."
              assert "legion_logo_final_hybrid.png" not in content, f"Quedó referencia PNG en {page}."
          print(f"OK: maestro {output.stat().st_size:,} bytes; 512px {responsive.stat().st_size:,} bytes; 256px {compact.stat().st_size:,} bytes; PNG {source.stat().st_size:,} bytes.")
          print("OK: 1600x1600 + 512x512 + 256x256, canales alfa y srcset verificados.")
          PY
      - name: Auditar referencias de imágenes en main y snapshots históricos
        run: |
          mkdir -p reports/image-audit
          git worktree add --detach /tmp/image-audit-b8fd4ae b8fd4ae
          git worktree add --detach /tmp/image-audit-0d578a0 0d578a02cfe9ab775ad4623096a93d2d33641fd8
          python scripts/audit_image_references.py --root /tmp/image-audit-b8fd4ae --output reports/image-audit/b8fd4ae.md
          python scripts/audit_image_references.py --root /tmp/image-audit-0d578a0 --output reports/image-audit/0d578a0.md
          python scripts/audit_image_references.py --root . --output reports/image-audit/main.md
      - name: Compilar colectores Python
        run: python -m py_compile scripts/audit_image_references.py update_stats.py update_platform_stats.py update_clips.py scripts/validate_roster_data.py scripts/validate_games_registry.py scripts/validate_clips_data.py scripts/render_roster_noscript.py scripts/validate_metric_history.py scripts/build_creator_metrics.py scripts/validate_creator_metrics.py scripts/growth_analytics.py scripts/validate_creator_records.py scripts/validate_data_contracts.py scripts/audit_public_links.py scripts/resolve_main_preview.py scripts/bootstrap_twitch_followers_oauth.py scripts/audit_and_optimize_images.py scripts/optimize_logo.py scripts/optimize_hero_image.py scripts/add_image_dimensions.py scripts/summarize_lighthouse.py scripts/lh_failures.py
      - name: Ejecutar pruebas unitarias Python del repositorio
        run: python -m unittest discover -s tests -v
      - name: Probar lectura de cuentas por los colectores
        run: |
          python -c "import update_stats; channels=update_stats.load_active_channels(); assert len(channels)==7 and 'losmoriartys' in channels; print('OK: colector Twitch lee {} canales'.format(len(channels)))"
          python -c "import update_platform_stats; creators=update_platform_stats.load_creator_accounts(); assert 'pato-oratoris' in creators and 'youtube' in [a['platform'] for a in creators['pato-oratoris']['accounts']]; print('OK: colector multiplataforma lee {} perfiles'.format(len(creators)))"
      - name: Validar registro de clips públicos
        run: python scripts/validate_clips_data.py
      - name: Validar historial y semántica de métricas Twitch
        run: python scripts/validate_metric_history.py
      - name: Generar registro normalizado de métricas por creador
        run: python scripts/build_creator_metrics.py
      - name: Validar vínculos, colaboraciones y autorización de audiencia
        run: python scripts/validate_creator_records.py
      - name: Validar modelo normalizado multiplataforma y Crecimiento
        run: python scripts/validate_creator_metrics.py
      - name: Validar contratos canónicos e integridad entre archivos
        run: python scripts/validate_data_contracts.py
      - name: Instalar dependencias de pruebas de navegador
        run: npm install
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Probar expedientes, Bitácora, cuatro pestañas, responsive e historial
        env:
          MAIN_BASELINE_URL: ${{ steps.main-preview.outputs.url || 'http://127.0.0.1:4173/' }}
        run: npm run test:e2e
      - name: Publicar capturas de revisión visual de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roster-visual-review-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Comprobar el registro de canales para el colector de clips
        run: |
          python -c "import update_clips; accounts=update_clips.load_roster_accounts(); assert len(accounts)==7 and any(a['creator_id']=='moriartys' for a in accounts); print('OK: colector de clips lee {} canales Twitch'.format(len(accounts)))"
      - name: Validar rutas, imágenes y enlaces declarados
        run: python scripts/validate_site.py
      - name: Publicar auditorías de referencias de imágenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-reference-audit-${{ github.sha }}
          path: reports/image-audit/
          if-no-files-found: warn
          retention-days: 30
