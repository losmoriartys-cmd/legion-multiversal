name: Rebuild creator metrics (temporary sync helper · regenerate after sync)
on:
  push:
    branches:
      - sync/roster-main-2026-11-15
    paths:
      - 'data.json'
      - 'platform-stats.json'
      - 'roster-data.json'
      - 'clips-data.json'
      - 'scripts/build_creator_metrics.py'
      - 'scripts/validate_creator_metrics.py'
      - '.github/workflows/rebuild-metrics-sync.yml'
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/sync/roster-main-2026-11-15'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerar métricas desde las fuentes sincronizadas
        run: |
          python scripts/build_creator_metrics.py
          python scripts/validate_creator_metrics.py
          python scripts/check_creator_metrics_freshness.py --metrics creator-metrics.json:generated_at --source data.json:updated_at --source platform-stats.json:updated_at --tolerance 300 --provenance source_snapshot
      - name: Guardar únicamente el registro derivado en esta rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creator-metrics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(stats): rebuild creator metrics after main sync"
          git push origin HEAD:${{ github.ref_name }}
