name: Actualizar estadísticas multiplataforma

on:
  push:
    branches:
      - main
    paths:
      - 'update_stats.py'
      - 'update_platform_stats.py'
      - 'platform-registry.json'
      - '.github/workflows/actualizar-stats.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: twitch-stats-update
  cancel-in-progress: false

jobs:
  actualizar:
    # Evita que workflow_dispatch ejecute el colector desde ramas distintas de main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sincronizar main antes de recolectar
        run: git pull --rebase origin main

      - name: Verificar credenciales de Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          if [ -z "$TWITCH_CLIENT_ID" ]; then
            echo "::error::Falta configurar TWITCH_CLIENT_ID en GitHub Actions Secrets."
            exit 1
          fi
          if [ -z "$TWITCH_CLIENT_SECRET" ]; then
            echo "::error::Falta configurar TWITCH_CLIENT_SECRET en GitHub Actions Secrets."
            exit 1
          fi
          echo "Credenciales Twitch presentes; valores omitidos por seguridad."

      - name: Consultar Twitch y guardar muestras
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python update_stats.py

      - name: Verificar muestras Twitch completas
        run: |
          python -c "import json; from pathlib import Path; d=json.loads(Path('data.json').read_text(encoding='utf-8')); e=set(d.get('active_channels', [])); c=d.get('collection', {}); covered=set(c.get('sampled_channels', [])) | set(c.get('skipped_channels', [])); missing=[x for x in e if x not in d.get('channels', {}) or not d['channels'][x].get('updated_at')]; assert c.get('complete') and covered == e and not missing, 'Recolección Twitch incompleta: ' + ', '.join(missing); print('Verificación OK: {} canales; {} muestras nuevas; {} omitidas por anti-duplicados.'.format(len(e), len(c.get('sampled_channels', [])), len(c.get('skipped_channels', []))))"

      - name: Consultar YouTube y Kick
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
        run: python update_platform_stats.py

      - name: Validar sitio antes de guardar datos
        run: python scripts/validate_site.py

      - name: Guardar historial actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json platform-stats.json
          if git diff --cached --quiet; then
            echo "No hay cambios de estadísticas para guardar."
            exit 0
          fi
          git commit -m "📊 Actualización automática de estadísticas multiplataforma"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rechazado (intento ${attempt}); sincronizando main antes de reintentar."
            git fetch origin main
            git rebase origin/main
          done
          echo "ERROR: no se pudo publicar tras 3 intentos."
          exit 1

      - name: Abrir incidencia si falla el colector
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Fallo del colector de estadísticas · ejecución ${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (existing.data.some(issue => issue.title === title)) {
              core.info('La incidencia de esta ejecución ya existe.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'El workflow del colector de estadísticas terminó con error.',
                '',
                `Ejecución: ${runUrl}`,
                `Rama: ${context.ref}`,
                `Commit: ${context.sha}`,
                '',
                'Revisar los pasos fallidos y los logs. No incluir credenciales en comentarios ni en la incidencia.'
              ].join('\n')
            });
