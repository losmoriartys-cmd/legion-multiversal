name: Actualizar estadísticas Twitch

on:
  push:
    paths:
      - 'update_stats.py'
      - '.github/workflows/actualizar-stats.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twitch-stats-update
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar Twitch y guardar muestras
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python update_stats.py

      - name: Guardar historial actualizado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Actualización automática de estadísticas Twitch"
          file_pattern: data.json
