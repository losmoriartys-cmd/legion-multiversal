name: Actualizar estadísticas multiplataforma

on:
  push:
    branches:
      - main
    paths:
      - 'update_stats.py'
      - 'update_platform_stats.py'
      - 'update_clips.py'
      - 'scripts/build_creator_metrics.py'
      - 'scripts/validate_creator_metrics.py'
      - 'scripts/growth_analytics.py'
      - 'scripts/validate_creator_records.py'
      - 'data/creator-records.json'
      - 'data/roster.json'
      - 'scripts/validate_roster_data.py'
      - '.github/workflows/actualizar-stats.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twitch-stats-update
  cancel-in-progress: false

jobs:
  actualizar:
    # Evita que workflow_dispatch ejecute el colector desde ramas distintas de main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Token con permiso de bypass del ruleset de main; si no existe, usa el del workflow.
          token: ${{ secrets.COLLECTOR_PUSH_TOKEN || github.token }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar cifrado del refresh token OAuth
        run: python -m pip install 'cryptography>=42,<47'

      - name: Sincronizar main antes de recolectar
        run: git pull --rebase origin main

      - name: Ejecutar pruebas unitarias de colectores
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Consultar Twitch y guardar muestras
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_FOLLOWERS_REFRESH_TOKEN: ${{ secrets.TWITCH_FOLLOWERS_REFRESH_TOKEN }}
          TWITCH_FOLLOWERS_TOKEN_KEY: ${{ secrets.TWITCH_FOLLOWERS_TOKEN_KEY }}
        run: python update_stats.py

      - name: Verificar muestras Twitch completas
        run: |
          python -c "import json; from pathlib import Path; d=json.loads(Path('data.json').read_text(encoding='utf-8')); e=set(d.get('active_channels', [])); c=d.get('collection', {}); covered=set(c.get('sampled_channels', [])) | set(c.get('skipped_channels', [])); missing=[x for x in e if x not in d.get('channels', {}) or not d['channels'][x].get('last_status_at') or not d['channels'][x].get('updated_at')]; assert c.get('status_complete') and c.get('coverage_complete') and covered == e and not missing and d.get('updated_at'), 'Consulta Twitch incompleta o sin estado válido: ' + ', '.join(missing); assert c.get('complete') == c.get('sampling_complete'), 'Estado complete inconsistente'; print('Verificación OK: {} estados Helix; {} snapshots nuevos; {} canales omitidos por ventana de 45 minutos.'.format(len(e), len(c.get('sampled_channels', [])), len(c.get('skipped_channels', []))))"

      - name: Validar registro de cuentas y cobertura Twitch
        run: python scripts/validate_roster_data.py --check-activity

      - name: Consultar clips públicos de Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python update_clips.py

      - name: Validar archivo de clips públicos
        run: python scripts/validate_clips_data.py

      - name: Consultar YouTube y Kick
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
        run: python update_platform_stats.py

      - name: Validar cuentas multiplataforma publicadas
        run: python scripts/validate_roster_data.py --check-platforms

      - name: Validar evidencias de colaboraciones y permisos de audiencia
        run: python scripts/validate_creator_records.py

      - name: Generar registro normalizado de métricas por creador
        run: python scripts/build_creator_metrics.py

      - name: Validar registro normalizado de métricas
        run: python scripts/validate_creator_metrics.py

      - name: Guardar historial actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json platform-stats.json clips-data.json creator-metrics.json
          if [ -f twitch-followers-refresh-token.enc ]; then
            git add twitch-followers-refresh-token.enc
          fi
          if git diff --cached --quiet; then
            echo "No hay cambios de estadísticas para guardar."
            exit 0
          fi
          git commit -m "📊 Actualización automática de métricas y clips públicos"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rechazado (intento ${attempt}); sincronizando main antes de reintentar."
            git fetch origin main
            git rebase origin/main
          done
          echo "ERROR: no se pudo publicar tras 3 intentos."
          exit 1
