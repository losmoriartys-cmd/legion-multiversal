name: Actualizar estadísticas de Twitch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      period_days:
        description: "Período de estadísticas (días)"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: twitch-stats-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Twitch data
        env:
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          STATS_PERIOD_DAYS: ${{ inputs.period_days || '30' }}
        run: python update_stats.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No hay cambios de datos para guardar."
            exit 0
          fi
          git commit -m "chore: update Twitch channel statistics"
          git push
