name: Actualizar estadísticas multiplataforma

on:
  push:
    paths:
      - 'update_stats.py'
      - 'update_platform_stats.py'
      - 'platform-registry.json'
      - '.github/workflows/actualizar-stats.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twitch-stats-update
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sincronizar main antes de recolectar
        run: git pull --rebase origin main

      - name: Consultar Twitch y guardar muestras
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python update_stats.py

      - name: Verificar muestras Twitch completas
        run: |
          python -c "import json; from pathlib import Path; d=json.loads(Path('data.json').read_text(encoding='utf-8')); e=set(d.get('active_channels', [])); c=d.get('collection', {}); covered=set(c.get('sampled_channels', [])) | set(c.get('skipped_channels', [])); missing=[x for x in e if x not in d.get('channels', {}) or not d['channels'][x].get('updated_at')]; assert c.get('complete') and covered == e and not missing, 'Recolección Twitch incompleta: ' + ', '.join(missing); print('Verificación OK: {} canales; {} muestras nuevas; {} omitidas por anti-duplicados.'.format(len(e), len(c.get('sampled_channels', [])), len(c.get('skipped_channels', []))))"

      - name: Consultar YouTube y Kick
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
        run: python update_platform_stats.py

      - name: Guardar historial actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json platform-stats.json
          if git diff --cached --quiet; then
            echo "No hay cambios de estadísticas para guardar."
            exit 0
          fi
          git commit -m "📊 Actualización automática de estadísticas multiplataforma"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rechazado (intento ${attempt}); sincronizando main antes de reintentar."
            git fetch origin main
            git rebase origin/main
          done
          echo "ERROR: no se pudo publicar tras 3 intentos."
          exit 1
