name: Optimizar emblema oficial

on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_logo.py'
      - '.github/workflows/optimize-logo.yml'

permissions:
  contents: write

concurrency:
  group: optimize-logo-main
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Convertir y verificar el emblema
        run: python scripts/optimize_logo.py
      - name: Publicar WebP y referencias en main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
          else
            git commit -m "perf(brand): serve responsive WebP emblem variants"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Variantes del emblema publicadas en main."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "No se pudo publicar el emblema después de 3 intentos." >&2
                exit 1
              fi
              sleep 2
            done
          fi
