name: Backup independiente del repositorio

on:
  push:
    branches:
      - work/base02-candidate-reconciled
    paths:
      - '.github/workflows/independent-backup.yml'
      - 'scripts/google_drive_backup.py'
      - 'scripts/google_drive_restore.py'
      - 'scripts/verify_critical_restore.py'
      - 'scripts/create_repo_backup.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout completo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Ejecutar pruebas del verificador de los 14 archivos
        run: python -m unittest discover -s tests -p 'test_verify_critical_restore.py' -v

      - name: Verificar credenciales del contrato Google Drive
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || 'root' }}
        run: |
          set -euo pipefail
          for name in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta la credencial OAuth existente $name para Google Drive; no se intentará usar otro proveedor."
              exit 1
            fi
          done
          if [ -z "$GOOGLE_DRIVE_FOLDER_ID" ]; then
            echo "::error::El destino Google Drive no está definido."
            exit 1
          fi
          echo "Destino de backup: Google Drive / $GOOGLE_DRIVE_FOLDER_ID"

      - name: Ejecutar backup en Google Drive y verificar descarga de retorno
        id: backup
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || 'root' }}
        run: |
          set -euo pipefail
          python scripts/google_drive_backup.py | tee backup-result.json
          BACKUP_ID="$(python -c 'import json; print(json.load(open("backup-result.json", encoding="utf-8"))["backup_id"])')"
          test -n "$BACKUP_ID"
          echo "backup_id=$BACKUP_ID" >> "$GITHUB_OUTPUT"
          echo "BACKUP_ID=$BACKUP_ID" >> "$GITHUB_ENV"

      - name: Preparar destino de restauración aislado
        run: |
          set -euo pipefail
          TARGET="/tmp/legion-drive-restore-$GITHUB_RUN_ID"
          if [ -e "$TARGET" ] && [ -n "$(find "$TARGET" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "::error::El destino de restauración existe y no está vacío."
            exit 1
          fi
          mkdir -p "$TARGET"
          test -z "$(find "$TARGET" -mindepth 1 -maxdepth 1 -print -quit)"
          echo "RESTORE_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Descargar de Google Drive y restaurar bundle y snapshot
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || 'root' }}
        run: |
          set -euo pipefail
          python scripts/google_drive_restore.py --backup-id "$BACKUP_ID" --target "$RESTORE_TARGET" | tee restore-result.json
          python -m json.tool restore-result.json

      - name: Verificar SHA-256 de los 14 archivos críticos contra el SHA de origen
        run: |
          set -euo pipefail
          python scripts/verify_critical_restore.py \
            --repository "$RESTORE_TARGET/repository-from-bundle" \
            --snapshot "$RESTORE_TARGET/source-snapshot" \
            --commit "$GITHUB_SHA" \
            --output critical-files-sha256.json | tee critical-files-verification.log
          grep -q 'RESTORE_CRITICAL_FILES: PASS (14/14 SHA-256 match)' critical-files-verification.log

      - name: Preparar evidencia del roundtrip
        if: always()
        env:
          BACKUP_ID: ${{ steps.backup.outputs.backup_id }}
        run: |
          mkdir -p backup-evidence
          cp backup-result.json restore-result.json critical-files-sha256.json critical-files-verification.log backup-evidence/ 2>/dev/null || true
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'backup_id=%s\n' "$BACKUP_ID"
            printf 'destination=Google Drive / root (My Drive unless an existing folder ID is configured)\n'
            printf 'rotation=disabled\n'
            printf 'automatic_deletion=disabled\n'
          } > backup-evidence/run-metadata.txt

      - name: Publicar evidencia del roundtrip
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: google-drive-roundtrip-evidence-${{ github.run_id }}
          path: backup-evidence/
          if-no-files-found: warn
          retention-days: 14
