name: Streams Charts — consulta gratuita

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamscharts-free-check
  cancel-in-progress: false

jobs:
  fetch-free-top100:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar top 100 Twitch gratuito (7 días)
        env:
          STREAMSCHARTS_CLIENT_ID: ${{ secrets.STREAMSCHARTS_CLIENT_ID }}
          STREAMSCHARTS_TOKEN: ${{ secrets.STREAMSCHARTS_TOKEN }}
        run: python update_streamscharts.py

      - name: Guardar snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamscharts-data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el snapshot."
            exit 0
          fi
          git commit -m "📈 Actualizar snapshot gratuito de Streams Charts"
          git pull --rebase origin main
          git push
