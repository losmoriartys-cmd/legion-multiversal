name: Validar colector de estadísticas

on:
  push:
    branches:
      - main
    paths:
      - 'update_*.py'
      - 'scripts/**'
      - 'tests/**'
      - 'data.json'
      - 'platform-stats.json'
      - 'clips-data.json'
      - 'data/roster.json'
      - 'creator-records.json'
      - 'creator-metrics.json'
      - 'app.js'
      - 'roster-02-moriartys.html'
      - '.github/workflows/test-stats.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'update_*.py'
      - 'scripts/**'
      - 'tests/**'
      - 'clips-data.json'
      - 'update_stats.py'
      - 'update_clips.py'
      - 'app.js'
      - 'roster-02-moriartys.html'
      - 'tests/**'
      - 'scripts/validate_clips_data.py'
      - 'scripts/validate_metric_history.py'
      - 'scripts/build_creator_metrics.py'
      - 'scripts/validate_creator_metrics.py'
      - 'scripts/check_creator_metrics_freshness.py'
      - 'platform-stats.json'
      - 'creator-records.json'
      - 'data/roster.json'
      - 'scripts/check_identity_consistency.py'
      - 'data.json'
      - 'creator-metrics.json'
      - '.github/workflows/test-stats.yml'

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas del colector
        run: python -m unittest discover -s tests -v
      - name: Probar identidad y conservación de registros
        run: python scripts/check_identity_consistency.py --selftest
      - name: Verificar claves y slugs del Roster
        run: |
          python scripts/check_identity_consistency.py --roster data/roster.json --records creator-records.json --platform platform-stats.json \
            --baseline tests/baselines/identity-before-canonical-migration.json --approved-editorial tests/baselines/approved-editorial-updates.json --strict --skip-platform
      - name: Verificar conservación contra línea base versionada
        run: |
          test -s tests/baselines/identity-before-canonical-migration.json
          grep -q "11f56fce5c52a284325e8016d5590d9ee223bf21" tests/baselines/identity-before-canonical-migration.json
      - name: Probar unidad del control de frescura y procedencia
        run: python scripts/check_creator_metrics_freshness.py --selftest
      - name: Verificar el creator-metrics.json versionado contra sus fuentes
        run: python scripts/check_creator_metrics_freshness.py --metrics creator-metrics.json:generated_at --source data.json:updated_at --source platform-stats.json:updated_at --tolerance 300 --provenance source_snapshot
      - name: Generar registro normalizado de métricas
        run: python scripts/build_creator_metrics.py
      - name: Validar registro normalizado
        run: python scripts/validate_creator_metrics.py
      - name: Publicar artefacto de métricas generado
        uses: actions/upload-artifact@v4
        with:
          name: creator-metrics-${{ github.sha }}
          path: creator-metrics.json
          if-no-files-found: error
          retention-days: 7
