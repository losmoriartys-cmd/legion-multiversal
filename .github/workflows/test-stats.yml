name: Validar colector de estadísticas

on:
  pull_request:
    branches:
      - main
    paths:
      - 'update_stats.py'
      - 'update_clips.py'
      - 'tests/**'
      - 'scripts/validate_clips_data.py'
      - 'scripts/validate_metric_history.py'
      - 'scripts/build_creator_metrics.py'
      - 'scripts/validate_creator_metrics.py'
      - '.github/workflows/test-stats.yml'

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas del colector
        run: python -m unittest discover -s tests -v
      - name: Generar registro normalizado de métricas
        run: python scripts/build_creator_metrics.py
      - name: Validar registro normalizado
        run: python scripts/validate_creator_metrics.py
      - name: Publicar artefacto de métricas generado
        uses: actions/upload-artifact@v4
        with:
          name: creator-metrics-${{ github.sha }}
          path: creator-metrics.json
          if-no-files-found: error
          retention-days: 7
