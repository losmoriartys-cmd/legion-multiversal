name: Lighthouse · producción Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.html'
      - '*.css'
      - 'assets/**'
      - 'scripts/lighthouse_runs.sh'
      - 'scripts/summarize_lighthouse.py'
      - '.github/workflows/lighthouse-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-production
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Esperar publicación de la revisión de producción en Cloudflare Pages
        env:
          PRODUCTION_URL: https://legion-multiversal.pages.dev/
          EXPECTED_SOURCE_REVISION: cbb329b3512a4b0bc9acd6663061926f2808afb6
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            html="$(curl --location --fail --silent --show-error "$PRODUCTION_URL" || true)"
            if [[ -n "$html" ]] && grep -Fq "name=\"lm-source-revision\" content=\"$EXPECTED_SOURCE_REVISION\"" <<< "$html" \
              && grep -Fq "https://legion-multiversal.pages.dev/" <<< "$html"; then
              echo "Cloudflare Pages sirve la revisión de contenido esperada y el dominio canónico correcto."
              exit 0
            fi
            echo "Intento $attempt/40 · esperando que Cloudflare Pages publique la revisión $EXPECTED_SOURCE_REVISION."
            sleep 15
          done
          echo "Cloudflare Pages no confirmó la revisión esperada en $PRODUCTION_URL."
          exit 1
      - name: Ejecutar Lighthouse móvil y escritorio (3 corridas por perfil)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          RUNS: '3'
          OUT_DIR: reports/lighthouse
        run: bash scripts/lighthouse_runs.sh "https://legion-multiversal.pages.dev/"
      - name: Diagnosticar la primera corrida móvil
        if: always()
        run: |
          if [[ -f reports/lighthouse/production-mobile/run1.report.json ]]; then
            python3 scripts/lh_failures.py reports/lighthouse/production-mobile/run1.report.json
          fi
      - name: Publicar informes Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-cloudflare-production-${{ github.sha }}
          path: reports/lighthouse/
          if-no-files-found: warn
          retention-days: 30
