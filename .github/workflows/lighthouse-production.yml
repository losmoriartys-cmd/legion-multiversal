name: Lighthouse · producción Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.html'
      - '*.css'
      - 'assets/**'
      - '*.webp'
      - 'scripts/lighthouse_runs.sh'
      - 'scripts/summarize_lighthouse.py'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: lighthouse-production
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Confirmar que Cloudflare publicó este SHA en producción
        env:
          PRODUCTION_URL: https://legion-multiversal.pages.dev/
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${EXPECTED_SHA:0:7}"
          for attempt in $(seq 1 40); do
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs" \
              -o /tmp/check-runs.json
            if python - "$short_sha" <<'PY'
          import json, sys
          short_sha = sys.argv[1]
          data = json.load(open("/tmp/check-runs.json", encoding="utf-8"))
          for check in data.get("check_runs", []):
              if check.get("name") != "Cloudflare Pages":
                  continue
              summary = check.get("output", {}).get("summary", "")
              if check.get("status") == "completed" and check.get("conclusion") == "success" and short_sha in summary:
                  print(f"Cloudflare Pages confirmó el SHA {short_sha}.")
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              break
            fi
            echo "Intento $attempt/40 · esperando el check Cloudflare Pages para $short_sha."
            sleep 15
          done
          html="$(curl --location --fail --silent --show-error "$PRODUCTION_URL")"
          grep -Fq 'https://legion-multiversal.pages.dev/' <<< "$html"
          headers="$(curl --location --fail --silent --show-error -I "${PRODUCTION_URL}image_20261106_124855.webp")"
          grep -Eiq '^content-type: image/webp' <<< "$headers"
          echo "Dominio canónico y recurso WebP de producción confirmados para $EXPECTED_SHA."
          echo "SHA medido: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "URL medida: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Ejecutar Lighthouse móvil y escritorio (3 corridas por perfil)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          RUNS: '3'
          OUT_DIR: reports/lighthouse
        run: bash scripts/lighthouse_runs.sh "https://legion-multiversal.pages.dev/"
      - name: Diagnosticar la primera corrida móvil
        if: always()
        run: |
          if [[ -f reports/lighthouse/production-mobile/run1.report.json ]]; then
            python3 scripts/lh_failures.py reports/lighthouse/production-mobile/run1.report.json
          fi
      - name: Publicar informes Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-cloudflare-production-${{ github.sha }}
          path: reports/lighthouse/
          if-no-files-found: warn
          retention-days: 30
