name: Lighthouse · producción Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.html'
      - '*.css'
      - 'assets/**'
      - '*.webp'
      - 'scripts/lighthouse_runs.sh'
      - 'scripts/summarize_lighthouse.py'
      - '.github/workflows/lighthouse-production.yml'
      - '.github/workflows/validar-sitio.yml'
      - 'scripts/optimize_logo.py'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: lighthouse-production
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Confirmar que Cloudflare publicó este SHA en producción
        env:
          PRODUCTION_URL: https://legion-multiversal.pages.dev/
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${EXPECTED_SHA:0:7}"
          for attempt in $(seq 1 40); do
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs" \
              -o /tmp/check-runs.json
            if python - "$short_sha" <<'PY'
          import json, sys
          short_sha = sys.argv[1]
          data = json.load(open("/tmp/check-runs.json", encoding="utf-8"))
          for check in data.get("check_runs", []):
              if check.get("name") != "Cloudflare Pages":
                  continue
              summary = check.get("output", {}).get("summary", "")
              if check.get("status") == "completed" and check.get("conclusion") == "success" and short_sha in summary:
                  print(f"Cloudflare Pages confirmó el SHA {short_sha}.")
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              break
            fi
            echo "Intento $attempt/40 · esperando el check Cloudflare Pages para $short_sha."
            sleep 15
          done
          html="$(curl --location --fail --silent --show-error "$PRODUCTION_URL")"
          grep -Fq 'https://legion-multiversal.pages.dev/' <<< "$html"
          grep -Fq 'legion_logo_final_hybrid-512.webp' <<< "$html"
          headers="$(curl --location --fail --silent --show-error -I "${PRODUCTION_URL}image_20261106_124855.webp")"
          grep -Eiq '^content-type: image/webp' <<< "$headers"
          logo_headers="$(curl --location --fail --silent --show-error -I "${PRODUCTION_URL}legion_logo_final_hybrid.webp")"
          grep -Eiq '^content-type: image/webp' <<< "$logo_headers"
          responsive_logo_headers="$(curl --location --fail --silent --show-error -I "${PRODUCTION_URL}legion_logo_final_hybrid-512.webp")"
          grep -Eiq '^content-type: image/webp' <<< "$responsive_logo_headers"
          echo "Dominio canónico, Hero WebP, emblema maestro y derivado responsive confirmados para $EXPECTED_SHA."
          echo "SHA medido: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "URL medida: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Comprobar endpoint seguro de contacto en producción
        env:
          PRODUCTION_URL: https://legion-multiversal.pages.dev
        run: |
          set -euo pipefail
          config="$(curl --location --fail --silent --show-error -H 'Accept: application/json' "$PRODUCTION_URL/api/contact")"
          python - "$config" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          config = json.loads(sys.argv[1])
          if not isinstance(config.get("configured"), bool):
              raise SystemExit("GET /api/contact no devolvió el contrato de configuración esperado.")
          if config["configured"] and not config.get("turnstileSiteKey"):
              raise SystemExit("El endpoint indica configured=true pero no publica la Site Key.")
          print("## Contacto en producción")
          print(f"- Endpoint GET: disponible")
          print(f"- Configuración completa: {'sí' if config['configured'] else 'no'}")
          print(f"- Site Key pública disponible: {'sí' if bool(config.get('turnstileSiteKey')) else 'no'}")
          PY
          status="$(curl --location --silent --show-error -o /tmp/contact-probe.json -w '%{http_code}' \
            -X POST \
            -H "Origin: $PRODUCTION_URL" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"type":"brand","fields":{},"turnstileToken":""}' \
            "$PRODUCTION_URL/api/contact")"
          case "$status" in
            400|503) echo "POST de control rechazado correctamente sin token (HTTP $status)." ;;
            *) cat /tmp/contact-probe.json; echo "Respuesta inesperada del endpoint de contacto: HTTP $status."; exit 1 ;;
          esac
      - name: Ejecutar Lighthouse móvil y escritorio (3 corridas por perfil)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          RUNS: '3'
          OUT_DIR: reports/lighthouse
        run: bash scripts/lighthouse_runs.sh "https://legion-multiversal.pages.dev/"
      - name: Diagnosticar la primera corrida móvil
        if: always()
        run: |
          if [[ -f reports/lighthouse/production-mobile/run1.report.json ]]; then
            python3 scripts/lh_failures.py reports/lighthouse/production-mobile/run1.report.json
          fi
      - name: Publicar informes Lighthouse
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-cloudflare-production-${{ github.sha }}
          path: reports/lighthouse/
          if-no-files-found: warn
          retention-days: 30
